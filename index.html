<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metronom URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Sztywna wysokość okna */
            overflow: hidden; /* Blokada scrollowania ekranu */
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            height: 100vh; /* Rozciągnięcie na pełny ekran telefonu w pionie */
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Rozpycha elementy do krawędzi */
        }

        /* Wielkie przyciski dotykowe na krańcach ekranu */
        .wide-step-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            font-size: 3rem;
            font-weight: bold;
            width: 100%;
            height: 15vh; /* Zawsze zajmują 15% wysokości ekranu */
            cursor: pointer;
            transition: background 0.1s;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none; /* Blokada zaznaczania tekstu przy szybkim klikaniu */
            user-select: none;
        }
        .wide-step-btn:active {
            background: #333;
            color: #00e676;
        }

        /* Środkowa sekcja sterowania */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around; /* Równomierne rozłożenie w pionie */
            padding: 10px 20px;
            height: 70vh;
        }

        /* Pole wpisywania tempa */
        .bpm-input {
            font-size: 5.5rem;
            font-weight: bold;
            color: #00e676;
            background: transparent;
            border: none;
            border-bottom: 3px dashed #333;
            text-align: center;
            width: 220px;
            outline: none;
        }
        .bpm-input:focus {
            border-bottom: 3px solid #00e676;
        }
        /* Ukrywanie strzałek w input type=number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Kontener dla pionowego suwaka */
        .slider-wrapper {
            height: 35vh; /* Suwak zajmuje 35% wysokości całego ekranu */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Obrócenie suwaka do pionu */
        input[type=range] {
            -webkit-appearance: none;
            transform: rotate(-90deg); /* Obrót o 90 stopni w lewo */
            width: 30vh; /* Szerokość staje się wysokością po obrocie */
            background: #333;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }

        /* Stylizacja thumba (suwaka) dla lepszego chwytu */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #00e676;
            cursor: pointer;
        }
        input[type=range]::-moz-range-thumb {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #00e676;
            cursor: pointer;
            border: none;
        }

        /* Główny przycisk START/STOP */
        .main-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 15px 0;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            width: 90%;
            max-width: 300px;
            -webkit-user-select: none;
            user-select: none;
        }
        .main-btn:hover { background: #00b359; }
    </style>
</head>
<body>

<div class="container">
    <button class="wide-step-btn" id="plusBtn">+</button>
    
    <div class="main-content">
        <input type="number" id="bpmInput" class="bpm-input" min="40" max="250" value="120">
        
        <div class="slider-wrapper">
            <input type="range" id="bpmSlider" min="40" max="250" value="120">
        </div>
        
        <button id="playBtn" class="main-btn">START</button>
    </div>

    <button class="wide-step-btn" id="minusBtn">−</button>
</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let nextTickTime = 0.0;
    let timerId = null;
    
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmInput = document.getElementById('bpmInput');
    const playBtn = document.getElementById('playBtn');
    const plusBtn = document.getElementById('plusBtn');
    const minusBtn = document.getElementById('minusBtn');

    function getBPMFromURL() {
        const params = new URLSearchParams(window.location.search);
        const bpm = parseInt(params.get('bpm'));
        if (bpm && bpm >= 40 && bpm <= 250) {
            return bpm;
        }
        return 120;
    }

    function updateURL(bpm) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?bpm=' + bpm;
        window.history.pushState({path: newUrl}, '', newUrl);
    }

    function setTempo(newBPM, updateControls = true) {
        currentBPM = Math.max(40, Math.min(250, newBPM));
        
        if (updateControls) {
            bpmSlider.value = currentBPM;
            bpmInput.value = currentBPM;
        }
        updateURL(currentBPM);
    }

    let currentBPM = getBPMFromURL();
    setTempo(currentBPM);

    // Ponieważ suwak jest obrócony o -90 stopni:
    // ruch w górę fizycznie zwiększa wartość, ruch w dół zmniejsza.
    bpmSlider.addEventListener('input', (e) => {
        setTempo(e.target.value, false);
        bpmInput.value = currentBPM;
    });

    bpmInput.addEventListener('input', (e) => {
        let val = parseInt(e.target.value);
        if (val) {
            setTempo(val, false);
            bpmSlider.value = currentBPM;
        }
    });

    bpmInput.addEventListener('blur', (e) => {
        let val = parseInt(e.target.value);
        if (!val || val < 40) val = 40;
        if (val > 250) val = 250;
        setTempo(val);
    });

    plusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) + 1);
    });

    minusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) - 1);
    });

    function playClick(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 1000; 
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); 

        osc.start(time);
        osc.stop(time + 0.05);
    }

    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            playClick(nextTickTime);
            nextTickTime += 60.0 / currentBPM;
        }
        timerId = setTimeout(scheduler, 25);
    }

    playBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (isPlaying) {
            clearTimeout(timerId);
            playBtn.textContent = 'START';
            playBtn.style.background = '#00e676';
            isPlaying = false;
        } else {
            nextTickTime = audioCtx.currentTime + 0.05;
            scheduler();
            playBtn.textContent = 'STOP';
            playBtn.style.background = '#ff1744';
            isPlaying = true;
        }
    });
</script>

</body>
</html>
