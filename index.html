<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronom URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: #ffffff;
            padding-top: 50px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { font-size: 4rem; margin: 10px 0; color: #00e676; }
        input[type=range] {
            width: 100%;
            margin: 20px 0;
        }
        button {
            background: #00e676;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #00b359; }
        .info { color: #888; font-size: 0.9rem; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Metronom</h2>
    <h1 id="bpmDisplay">120</h1>
    <p>BPM</p>
    
    <input type="range" id="bpmSlider" min="40" max="250" value="120">
    <br>
    <button id="playBtn">START</button>
    
    <p class="info">Adres URL aktualizuje się automatycznie.</p>
</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let nextTickTime = 0.0;
    let timerId = null;
    
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const playBtn = document.getElementById('playBtn');

    // 1. Odbieranie parametrów z adresu URL przy starcie strony
    function getBPMFromURL() {
        const params = new URLSearchParams(window.location.search);
        const bpm = parseInt(params.get('bpm'));
        if (bpm && bpm >= 40 && bpm <= 250) {
            return bpm;
        }
        return 120; // domyślne
    }

    // 2. Aktualizacja adresu URL bez przeładowania strony
    function updateURL(bpm) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?bpm=' + bpm;
        window.history.pushState({path: newUrl}, '', newUrl);
    }

    // Ustawienie początkowej wartości
    let currentBPM = getBPMFromURL();
    bpmSlider.value = currentBPM;
    bpmDisplay.textContent = currentBPM;
    updateURL(currentBPM);

    // Reakcja na zmianę suwaka
    bpmSlider.addEventListener('input', (e) => {
        currentBPM = e.target.value;
        bpmDisplay.textContent = currentBPM;
        updateURL(currentBPM);
    });

    // Silnik audio metronomu
    function playClick(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 1000; // częstotliwość kliku w Hz
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); // czas trwania kliku

        osc.start(time);
        osc.stop(time + 0.05);
    }

    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            playClick(nextTickTime);
            nextTickTime += 60.0 / currentBPM;
        }
        timerId = setTimeout(scheduler, 25);
    }

    playBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (isPlaying) {
            clearTimeout(timerId);
            playBtn.textContent = 'START';
            playBtn.style.background = '#00e676';
            isPlaying = false;
        } else {
            nextTickTime = audioCtx.currentTime + 0.05;
            scheduler();
            playBtn.textContent = 'STOP';
            playBtn.style.background = '#ff1744';
            isPlaying = true;
        }
    });
</script>

</body>
</html>
