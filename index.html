<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Metronom URL</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        
        .app-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            background: #1e1e1e;
        }

        /* LEWA STRONA: Sekcja gigantycznych przycisków krokowych */
        .left-controls {
            flex: 1; /* Wypełnia całą szerokość aż do suwaka */
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .huge-btn {
            background: #222222;
            color: #ffffff;
            border: none;
            font-size: 5rem;
            font-weight: bold;
            height: 50vh; /* Każdy przycisk zajmuje dokładnie połowę wysokości ekranu */
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }
        
        /* Przycisk PLUS na górze, MINUS na dole */
        #plusBtn { border-bottom: 2px solid #121212; }
        #plusBtn:active { background: #2a2a2a; color: #00e676; }
        #minusBtn:active { background: #2a2a2a; color: #ff1744; }

        /* Centrowany panel nakładkowy na lewej sekcji (BPM i START) */
        .floating-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: auto; /* Pozwala klikać wewnątrz nakładki */
            z-index: 10;
            border: 1px solid #333;
        }

        /* Pole wpisywania tempa */
        .bpm-input {
            font-size: 4.5rem;
            font-weight: bold;
            color: #00e676;
            background: transparent;
            border: none;
            border-bottom: 3px dashed #444;
            text-align: center;
            width: 160px;
            outline: none;
            margin: 0;
        }
        .bpm-input:focus {
            border-bottom: 3px solid #00e676;
        }
        
        /* Ukrywanie fabrycznych strzałek inputów */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Główny przycisk START/STOP */
        .main-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            -webkit-user-select: none;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* PRAWA STRONA: Sekcja suwaka na 100% wysokości */
        .right-slider-zone {
            width: 85px; /* Szerokość strefy suwaka */
            height: 100vh;
            background: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-left: 2px solid #121212;
            flex-shrink: 0;
        }

        .slider-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Suwak obrócony pionowo na pełne 100% wysokości okna */
        input[type=range] {
            -webkit-appearance: none;
            transform: rotate(-90deg);
            width: 100vh; /* Dokładnie wysokość całego ekranu */
            background: #252525;
            height: 14px;
            border-radius: 0;
            outline: none;
            margin: 0;
        }

        /* Ogromny, łatwy do chwycenia Touch-Thumb */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 50px;
            border-radius: 12px; /* Lekko zaokrąglony kwadrat dla pewniejszego chwytu */
            background: #00e676;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }
        input[type=range]::-moz-range-thumb {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #00e676;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

<div class="app-layout">
    
    <div class="left-controls">
        <button class="huge-btn" id="plusBtn">+</button>
        <button class="huge-btn" id="minusBtn">−</button>
        
        <div class="floating-display">
            <input type="number" id="bpmInput" class="bpm-input" min="40" max="250" value="120">
            <button id="playBtn" class="main-btn">START</button>
        </div>
    </div>
    
    <div class="right-slider-zone">
        <div class="slider-wrapper">
            <input type="range" id="bpmSlider" min="40" max="250" value="120">
        </div>
    </div>

</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let nextTickTime = 0.0;
    let timerId = null;
    
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmInput = document.getElementById('bpmInput');
    const playBtn = document.getElementById('playBtn');
    const plusBtn = document.getElementById('plusBtn');
    const minusBtn = document.getElementById('minusBtn');

    function getBPMFromURL() {
        const params = new URLSearchParams(window.location.search);
        const bpm = parseInt(params.get('bpm'));
        if (bpm && bpm >= 40 && bpm <= 250) {
            return bpm;
        }
        return 120;
    }

    function updateURL(bpm) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?bpm=' + bpm;
        window.history.pushState({path: newUrl}, '', newUrl);
    }

    function setTempo(newBPM, updateControls = true) {
        currentBPM = Math.max(40, Math.min(250, newBPM));
        
        if (updateControls) {
            bpmSlider.value = currentBPM;
            bpmInput.value = currentBPM;
        }
        updateURL(currentBPM);
    }

    let currentBPM = getBPMFromURL();
    setTempo(currentBPM);

    // Suwak pionowy
    bpmSlider.addEventListener('input', (e) => {
        setTempo(e.target.value, false);
        bpmInput.value = currentBPM;
    });

    // Klawiatura
    bpmInput.addEventListener('input', (e) => {
        let val = parseInt(e.target.value);
        if (val) {
            setTempo(val, false);
            bpmSlider.value = currentBPM;
        }
    });

    bpmInput.addEventListener('blur', (e) => {
        let val = parseInt(e.target.value);
        if (!val || val < 40) val = 40;
        if (val > 250) val = 250;
        setTempo(val);
    });

    // Przyciski krokowe
    plusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) + 1);
    });

    minusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) - 1);
    });

    // Silnik audio
    function playClick(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 1000; 
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); 

        osc.start(time);
        osc.stop(time + 0.05);
    }

    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            playClick(nextTickTime);
            nextTickTime += 60.0 / currentBPM;
        }
        timerId = setTimeout(scheduler, 25);
    }

    playBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (isPlaying) {
            clearTimeout(timerId);
            playBtn.textContent = 'START';
            playBtn.style.background = '#00e676';
            isPlaying = false;
        } else {
            nextTickTime = audioCtx.currentTime + 0.05;
            scheduler();
            playBtn.textContent = 'STOP';
            playBtn.style.background = '#ff1744';
            isPlaying = true;
        }
    });

    // Blokada natywnych gestów przeglądarki mobilnej
    document.addEventListener('touchmove', function(e) {
        if(e.touches.length > 1) return;
        e.preventDefault();
    }, { passive: false });
</script>

</body>
</html>
