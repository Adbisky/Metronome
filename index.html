<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronom URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden; /* Aby przyciski na krańcach idealnie pasowały do zaokrągleń */
            display: flex;
            flex-direction: column;
        }
        /* Wielkie, łatwe do trafienia przyciski góra/dół */
        .wide-step-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            width: 100%;
            padding: 25px 0; /* Bardzo wysokie, idealne pod palec */
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            outline: none;
        }
        .wide-step-btn:active {
            background: #333;
            color: #00e676;
        }
        .main-content {
            padding: 30px 20px;
        }
        /* Styl dla pola wpisywania tempa */
        .bpm-input {
            font-size: 5rem;
            font-weight: bold;
            color: #00e676;
            background: transparent;
            border: none;
            border-bottom: 3px dashed #333;
            text-align: center;
            width: 200px;
            outline: none;
            margin: 10px 0;
        }
        .bpm-input:focus {
            border-bottom: 3px solid #00e676;
        }
        input[type=range] {
            width: 100%;
            margin: 25px 0;
        }
        .main-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 18px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
        }
        .main-btn:hover { background: #00b359; }
    </style>
</head>
<body>

<div class="container">
    <button class="wide-step-btn" id="plusBtn">+</button>
    
    <div class="main-content">
        <h2>Metronom</h2>
        
        <input type="number" id="bpmInput" class="bpm-input" min="40" max="250" value="120">
        <p style="margin: 0 0 10px 0; color: #888; font-size: 1rem;">BPM</p>
        
        <input type="range" id="bpmSlider" min="40" max="250" value="120">
        <br>
        <button id="playBtn" class="main-btn">START</button>
    </div>

    <button class="wide-step-btn" id="minusBtn">−</button>
</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let nextTickTime = 0.0;
    let timerId = null;
    
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmInput = document.getElementById('bpmInput');
    const playBtn = document.getElementById('playBtn');
    const plusBtn = document.getElementById('plusBtn');
    const minusBtn = document.getElementById('minusBtn');

    // Odbieranie parametrów z adresu URL przy starcie
    function getBPMFromURL() {
        const params = new URLSearchParams(window.location.search);
        const bpm = parseInt(params.get('bpm'));
        if (bpm && bpm >= 40 && bpm <= 250) {
            return bpm;
        }
        return 120;
    }

    // Aktualizacja adresu URL
    function updateURL(bpm) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?bpm=' + bpm;
        window.history.pushState({path: newUrl}, '', newUrl);
    }

    // Synchronizacja wszystkich elementów sterujących tempem
    function setTempo(newBPM, updateControls = true) {
        currentBPM = Math.max(40, Math.min(250, newBPM));
        
        if (updateControls) {
            bpmSlider.value = currentBPM;
            bpmInput.value = currentBPM;
        }
        updateURL(currentBPM);
    }

    let currentBPM = getBPMFromURL();
    setTempo(currentBPM);

    // Reakcja na zmianę suwaka
    bpmSlider.addEventListener('input', (e) => {
        setTempo(e.target.value, false);
        bpmInput.value = currentBPM;
    });

    // Reakcja na bezpośrednie wpisywanie z klawiatury
    bpmInput.addEventListener('input', (e) => {
        let val = parseInt(e.target.value);
        if (val) {
            setTempo(val, false);
            bpmSlider.value = currentBPM;
        }
    });

    // Korekta wartości przy wyjściu z pola wpisywania
    bpmInput.addEventListener('blur', (e) => {
        let val = parseInt(e.target.value);
        if (!val || val < 40) val = 40;
        if (val > 250) val = 250;
        setTempo(val);
    });

    // Przyciski Plus / Minus na krańcach ekranu
    plusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) + 1);
    });

    minusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) - 1);
    });

    // Silnik audio metronomu
    function playClick(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 1000; 
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); 

        osc.start(time);
        osc.stop(time + 0.05);
    }

    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            playClick(nextTickTime);
            nextTickTime += 60.0 / currentBPM;
        }
        timerId = setTimeout(scheduler, 25);
    }

    playBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (isPlaying) {
            clearTimeout(timerId);
            playBtn.textContent = 'START';
            playBtn.style.background = '#00e676';
            isPlaying = false;
        } else {
            nextTickTime = audioCtx.currentTime + 0.05;
            scheduler();
            playBtn.textContent = 'STOP';
            playBtn.style.background = '#ff1744';
            isPlaying = true;
        }
    });
</script>

</body>
</html>
