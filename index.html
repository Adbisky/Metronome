<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Metronom URL</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        
        .app-layout {
            display: flex;
            width: 100%;
            height: 100dvh;
            background: #1e1e1e;
            position: relative;
        }

        /* LEWA STRONA: Sekcja gigantycznych stref dotykowych */
        .left-controls {
            flex: 1;
            margin-right: 85px; 
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .huge-btn {
            background: #222222;
            color: #ffffff;
            border: none;
            height: 50dvh;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            position: relative; /* Potrzebne do pozycjonowania etykiet tekstowych */
        }
        
        #plusBtn { 
            box-shadow: inset 0 -2px 0 #121212; 
        }

        /* POPRAWKA: Przeniesienie znaków na absolutne skraje ekranu jako małe kółka, poza zasięg panelu */
        .btn-label {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: bold;
            pointer-events: none; /* Kliknięcia przelatują do głównego przycisku */
        }

        #plusBtn .btn-label {
            top: calc(20px + env(safe-area-inset-top, 0px));
        }

        #minusBtn .btn-label {
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        #plusBtn:active { background: #2a2a2a; }
        #plusBtn:active .btn-label { color: #00e676; background: rgba(0, 230, 118, 0.1); }
        
        #minusBtn:active { background: #2a2a2a; }
        #minusBtn:active .btn-label { color: #ff1744; background: rgba(255, 23, 68, 0.1); }

        /* Centrowany panel nakładkowy */
        .floating-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 20px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            z-index: 10;
            border: 1px solid #333;
            width: 250px;
        }

        /* Sekcja wyboru akcentu */
        .accent-selector {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
        }

        .accent-btn {
            flex: 1;
            background: #252525;
            color: #888;
            border: 1px solid #444;
            padding: 8px 0;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-user-select: none;
            user-select: none;
        }

        .accent-btn.active {
            background: #00e676;
            color: #000;
            border-color: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }

        /* Kontener na input oraz lampkę obok siebie */
        .display-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            position: relative;
            padding-left: 30px; 
        }

        /* Pole wpisywania tempa */
        .bpm-input {
            font-size: 3.8rem; 
            font-weight: bold;
            color: #00e676;
            background: transparent;
            border: none;
            border-bottom: 3px dashed #444;
            text-align: center;
            width: 135px;
            max-width: 100%;
            outline: none;
            margin: 0;
            letter-spacing: -1px; 
        }
        .bpm-input:focus {
            border-bottom: 3px solid #00e676;
        }

        /* CIEPŁA POMARAŃCZOWA LAMPKA LED */
        .led-indicator {
            width: 24px;
            height: 24px;
            background-color: #3a2010; 
            border: 2px solid #222;
            border-radius: 50%;
            transition: background-color 0.04s ease, box-shadow 0.04s ease;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        .led-indicator.flash-normal {
            background-color: #ffaa44;
            box-shadow: 0 0 15px #ffaa44, inset 0 1px 2px #fff;
        }

        .led-indicator.flash-accent {
            background-color: #ff8800;
            box-shadow: 0 0 30px #ff8800, 0 0 10px #ffaa44, inset 0 1px 2px #fff;
        }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Główny przycisk START/STOP */
        .main-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            -webkit-user-select: none;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* PRAWA STRONA: Dotykowa strefa suwaka */
        .right-slider-zone {
            position: absolute;
            right: 0;
            top: 0;
            width: 85px;
            height: 100dvh;
            background: #151515;
            border-left: 2px solid #121212;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .track-line {
            position: absolute;
            left: 50%;
            top: 25px;
            bottom: calc(25px + env(safe-area-inset-bottom, 0px));
            width: 8px;
            background: #252525;
            transform: translateX(-50%);
            border-radius: 4px;
            pointer-events: none; 
        }

        .custom-thumb {
            position: absolute;
            left: 50%;
            top: 50%; 
            width: 54px;
            height: 54px;
            background: #00e676;
            border-radius: 14px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            pointer-events: none; 
        }
    </style>
</head>
<body>

<div class="app-layout">
    
    <div class="left-controls">
        <button class="huge-btn" id="plusBtn">
            <span class="btn-label">+</span>
        </button>
        <button class="huge-btn" id="minusBtn">
            <span class="btn-label">−</span >
        </button>
        
        <div class="floating-display">
            <div class="accent-selector">
                <button class="accent-btn" data-beats="0" id="btn-0">0</button>
                <button class="accent-btn" data-beats="2" id="btn-2">2</button>
                <button class="accent-btn" data-beats="3" id="btn-3">3</button>
                <button class="accent-btn" data-beats="4" id="btn-4">4</button>
            </div>

            <div class="display-row">
                <input type="number" id="bpmInput" class="bpm-input" min="40" max="250" value="120">
                <div class="led-indicator" id="ledIndicator"></div>
            </div>

            <button id="playBtn" class="main-btn">START</button>
        </div>
    </div>
    
    <div class="right-slider-zone" id="sliderZone">
        <div class="track-line"></div>
        <div class="custom-thumb" id="customThumb"></div>
    </div>

</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let nextTickTime = 0.0;
    let timerId = null;
    
    let beatCounter = 0;
    let accentBeats = 4; 

    const bpmInput = document.getElementById('bpmInput');
    const playBtn = document.getElementById('playBtn');
    const plusBtn = document.getElementById('plusBtn');
    const minusBtn = document.getElementById('minusBtn');
    
    const sliderZone = document.getElementById('sliderZone');
    const customThumb = document.getElementById('customThumb');
    const accentBtns = document.querySelectorAll('.accent-btn');
    const ledIndicator = document.getElementById('ledIndicator');

    const MIN_BPM = 40;
    const MAX_BPM = 250;
    let currentBPM = 120;

    function loadStateFromURL() {
        const params = new URLSearchParams(window.location.search);
        
        const bpm = parseInt(params.get('bpm'));
        if (bpm && bpm >= MIN_BPM && bpm <= MAX_BPM) {
            currentBPM = bpm;
        } else {
            currentBPM = 120; 
        }

        const beats = params.get('beats');
        if (beats !== null && ['0', '2', '3', '4'].includes(beats)) {
            accentBeats = parseInt(beats);
        } else {
            accentBeats = 4; 
        }

        updateAccentUI();
    }

    function updateAccentUI() {
        accentBtns.forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${accentBeats}`);
        if (activeBtn) activeBtn.classList.add('active');
    }

    function updateURL(bpm, beats) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?bpm=${bpm}&beats=${beats}`;
        window.history.pushState({path: newUrl}, '', newUrl);
    }

    function updateThumbPosition() {
        const zoneHeight = sliderZone.clientHeight;
        const safeBottom = parseInt(window.getComputedStyle(sliderZone).paddingBottom) || 0;
        const padding = 25; 
        const availableHeight = zoneHeight - (padding * 2) - safeBottom;
        
        const percent = (currentBPM - MIN_BPM) / (MAX_BPM - MIN_BPM);
        const topPx = padding + (availableHeight * (1 - percent));
        
        customThumb.style.top = topPx + 'px';
    }

    function handleSliderTouch(clientY) {
        const rect = sliderZone.getBoundingClientRect();
        const zoneHeight = rect.height;
        const safeBottom = parseInt(window.getComputedStyle(sliderZone).paddingBottom) || 0;
        const padding = 25;
        const availableHeight = zoneHeight - (padding * 2) - safeBottom;
        
        let relativeY = clientY - rect.top - padding;
        relativeY = Math.max(0, Math.min(availableHeight, relativeY));
        
        const percent = 1 - (relativeY / availableHeight);
        const calculatedBPM = Math.round(MIN_BPM + (percent * (MAX_BPM - MIN_BPM)));
        
        setTempo(calculatedBPM);
    }

    function setTempo(newBPM, updateInputElement = true) {
        currentBPM = Math.max(MIN_BPM, Math.min(MAX_BPM, newBPM));
        
        if (updateInputElement) {
            bpmInput.value = currentBPM;
        }
        updateThumbPosition();
        updateURL(currentBPM, accentBeats);
    }

    let isDragging = false;

    sliderZone.addEventListener('mousedown', (e) => {
        isDragging = true;
        handleSliderTouch(e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
        if (isDragging) {
            handleSliderTouch(e.clientY);
        }
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    sliderZone.addEventListener('touchstart', (e) => {
        isDragging = true;
        handleSliderTouch(e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (isDragging) {
            handleSliderTouch(e.touches[0].clientY);
            e.preventDefault(); 
        }
    }, { passive: false });

    window.addEventListener('touchend', () => {
        isDragging = false;
    });

    loadStateFromURL();
    setTempo(currentBPM);
    setTimeout(updateThumbPosition, 100); 

    function commitBPM() {
        let val = parseInt(bpmInput.value);
        if (!val || val < MIN_BPM) val = MIN_BPM;
        if (val > MAX_BPM) val = MAX_BPM;
        setTempo(val);
    }

    bpmInput.addEventListener('blur', commitBPM);

    plusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) + 1);
    });

    minusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) - 1);
    });

    accentBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            accentBeats = parseInt(btn.getAttribute('data-beats'));
            beatCounter = 0; 
            updateAccentUI();
            updateURL(currentBPM, accentBeats);
        });
    });

    window.addEventListener('keydown', (e) => {
        if (document.activeElement === bpmInput) {
            if (e.key === 'Enter') {
                e.preventDefault();
                commitBPM();
                bpmInput.blur(); 
            }
            return; 
        }

        if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            playBtn.click();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setTempo(parseInt(currentBPM) + 1);
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            setTempo(parseInt(currentBPM) - 1);
        } else if (['0', '2', '3', '4'].includes(e.key)) {
            accentBeats = parseInt(e.key);
            beatCounter = 0;
            updateAccentUI();
            updateURL(currentBPM, accentBeats);
        }
    });

    window.addEventListener('resize', updateThumbPosition);

    function triggerVisualFlash(time, isAccent) {
        const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
        
        setTimeout(() => {
            ledIndicator.className = 'led-indicator';
            void ledIndicator.offsetWidth;
            
            if (isAccent) {
                ledIndicator.classList.add('flash-accent');
            } else {
                ledIndicator.classList.add('flash-normal');
            }
            
            setTimeout(() => {
                ledIndicator.className = 'led-indicator';
            }, 45);
            
        }, delayMs);
    }

    function playClick(time, isAccentMode) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        const noiseNode = audioCtx.createBufferSource();
        const noiseGain = audioCtx.createGain();
        
        const bufferSize = audioCtx.sampleRate * 0.01;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        noiseNode.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        osc.type = 'triangle';

        const forceFullPower = (accentBeats === 0);

        if (isAccentMode || forceFullPower) {
            osc.frequency.setValueAtTime(1200, time);
            osc.frequency.exponentialRampToValueAtTime(550, time + 0.015);
            
            filter.frequency.value = 1600;
            filter.Q.value = 5;

            gain.gain.setValueAtTime(1.0, time); 
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

            noiseGain.gain.setValueAtTime(0.9, time); 
            noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.012);
        } else {
            osc.frequency.setValueAtTime(750, time);
            osc.frequency.exponentialRampToValueAtTime(350, time + 0.012);
            
            filter.frequency.value = 1000;
            filter.Q.value = 3;

            gain.gain.setValueAtTime(0.8, time); 
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);

            noiseGain.gain.setValueAtTime(0.7, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.006);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        noiseNode.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        osc.start(time);
        osc.stop(time + 0.04);
        
        noiseNode.start(time);
        noiseNode.stop(time + 0.012);
    }

    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            let isAccent = false;
            
            if (accentBeats > 0) {
                if (beatCounter % accentBeats === 0) {
                    isAccent = true;
                }
            } else {
                isAccent = true;
            }

            playClick(nextTickTime, isAccent && accentBeats > 0);
            triggerVisualFlash(nextTickTime, isAccent);
            
            nextTickTime += 60.0 / currentBPM;
            beatCounter++;
        }
        timerId = setTimeout(scheduler, 25);
    }

    playBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (isPlaying) {
            clearTimeout(timerId);
            playBtn.textContent = 'START';
            playBtn.style.background = '#00e676';
            isPlaying = false;
            ledIndicator.className = 'led-indicator'; 
        } else {
            beatCounter = 0; 
            nextTickTime = audioCtx.currentTime + 0.05;
            scheduler();
            playBtn.textContent = 'STOP';
            playBtn.style.background = '#ff1744';
            isPlaying = true;
        }
    });

    document.addEventListener('touchmove', function(e) {
        if(e.touches.length > 1) return;
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
            e.preventDefault();
        }
    }, { passive: false });
</script>

</body>
</html>
