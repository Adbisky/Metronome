<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Metronom URL</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: fixed; /* Zapobiega przypadkowemu przeciąganiu strony (overscroll) */
            width: 100%;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
        }

        /* Guziki góra/dół - dopasowane rozmiarowo do kciuka, bezpieczna wysokość */
        .wide-step-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            width: 100%;
            height: 60px; /* Stała wysokość, która nie wypycha dołu */
            flex-shrink: 0; /* Zakaz kurczenia przycisków */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
        }
        .wide-step-btn:active {
            background: #333;
            color: #00e676;
        }

        /* Środkowa sekcja robocza - podział na lewą i prawą stronę */
        .main-content {
            flex: 1; /* Zajmuje całą dostępną przestrzeń między guzikami */
            display: flex;
            flex-direction: row; /* Układ obok siebie: lewa (tekst/start) | prawa (suwak) */
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            overflow: hidden;
        }

        /* Lewa kolumna: BPM oraz przycisk START/STOP */
        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            height: 100%;
        }

        /* Pole wpisywania tempa */
        .bpm-input {
            font-size: 5rem;
            font-weight: bold;
            color: #00e676;
            background: transparent;
            border: none;
            border-bottom: 3px dashed #333;
            text-align: center;
            width: 180px;
            outline: none;
            margin: 0;
        }
        .bpm-input:focus {
            border-bottom: 3px solid #00e676;
        }
        
        /* Ukrywanie fabrycznych strzałek inputów */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Prawa kolumna: Miejsce na pionowy suwak */
        .right-column {
            width: 70px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Kontener pozycjonujący i obracający suwak */
        .slider-wrapper {
            position: absolute;
            width: 100%;
            height: 95%; /* Dokładnie 95% wysokości środkowej sekcji */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pionowy fader dostosowany do wysokości kontenera wrapper */
        input[type=range] {
            -webkit-appearance: none;
            transform: rotate(-90deg);
            /* Szerokość staje się wysokością po obrocie. Pobiera ją z wysokości rodzica */
            width: calc(100vh - 120px - 40px); 
            background: #333;
            height: 10px;
            border-radius: 5px;
            outline: none;
            margin: 0;
        }

        /* Suwak (Thumb) przystosowany do ekranów dotykowych */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00e676;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-moz-range-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00e676;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Główny przycisk START/STOP */
        .main-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 18px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
            -webkit-user-select: none;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .main-btn:hover { background: #00b359; }
    </style>
</head>
<body>

<div class="container">
    <button class="wide-step-btn" id="plusBtn">+</button>
    
    <div class="main-content">
        <div class="left-column">
            <input type="number" id="bpmInput" class="bpm-input" min="40" max="250" value="120">
            <button id="playBtn" class="main-btn">START</button>
        </div>
        
        <div class="right-column">
            <div class="slider-wrapper">
                <input type="range" id="bpmSlider" min="40" max="250" value="120">
            </div>
        </div>
    </div>

    <button class="wide-step-btn" id="minusBtn">−</button>
</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let nextTickTime = 0.0;
    let timerId = null;
    
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmInput = document.getElementById('bpmInput');
    const playBtn = document.getElementById('playBtn');
    const plusBtn = document.getElementById('plusBtn');
    const minusBtn = document.getElementById('minusBtn');

    function getBPMFromURL() {
        const params = new URLSearchParams(window.location.search);
        const bpm = parseInt(params.get('bpm'));
        if (bpm && bpm >= 40 && bpm <= 250) {
            return bpm;
        }
        return 120;
    }

    function updateURL(bpm) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?bpm=' + bpm;
        window.history.pushState({path: newUrl}, '', newUrl);
    }

    function setTempo(newBPM, updateControls = true) {
        currentBPM = Math.max(40, Math.min(250, newBPM));
        
        if (updateControls) {
            bpmSlider.value = currentBPM;
            bpmInput.value = currentBPM;
        }
        updateURL(currentBPM);
    }

    let currentBPM = getBPMFromURL();
    setTempo(currentBPM);

    // Obsługa wejścia suwaka
    bpmSlider.addEventListener('input', (e) => {
        setTempo(e.target.value, false);
        bpmInput.value = currentBPM;
    });

    // Obsługa bezpośredniego wpisywania z klawiatury
    bpmInput.addEventListener('input', (e) => {
        let val = parseInt(e.target.value);
        if (val) {
            setTempo(val, false);
            bpmSlider.value = currentBPM;
        }
    });

    bpmInput.addEventListener('blur', (e) => {
        let val = parseInt(e.target.value);
        if (!val || val < 40) val = 40;
        if (val > 250) val = 250;
        setTempo(val);
    });

    // Obsługa wielkich przycisków kroków
    plusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) + 1);
    });

    minusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) - 1);
    });

    // Silnik dźwiękowy Web Audio API
    function playClick(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 1000; 
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); 

        osc.start(time);
        osc.stop(time + 0.05);
    }

    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            playClick(nextTickTime);
            nextTickTime += 60.0 / currentBPM;
        }
        timerId = setTimeout(scheduler, 25);
    }

    playBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (isPlaying) {
            clearTimeout(timerId);
            playBtn.textContent = 'START';
            playBtn.style.background = '#00e676';
            isPlaying = false;
        } else {
            nextTickTime = audioCtx.currentTime + 0.05;
            scheduler();
            playBtn.textContent = 'STOP';
            playBtn.style.background = '#ff1744';
            isPlaying = true;
        }
    });

    // Blokowanie gestów "pull-to-refresh" na urządzeniach mobilnych
    document.addEventListener('touchmove', function(e) {
        if(e.touches.length > 1) return;
        e.preventDefault();
    }, { passive: false });
</script>

</body>
</html>
