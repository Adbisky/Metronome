<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Metronom URL</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            /* Blokuje systemowe gesty i podwójne tąpnięcia powiększające ekran */
            touch-action: none; 
        }
        
        .app-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            background: #1e1e1e;
            position: relative;
        }

        /* LEWA STRONA: Sekcja gigantycznych przycisków krokowych */
        .left-controls {
            flex: 1;
            margin-right: 85px; /* Miejsce na suwak */
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .huge-btn {
            background: #222222;
            color: #ffffff;
            border: none;
            font-size: 5rem;
            font-weight: bold;
            height: 50vh;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }
        
        #plusBtn { border-bottom: 2px solid #121212; }
        #plusBtn:active { background: #2a2a2a; color: #00e676; }
        #minusBtn:active { background: #2a2a2a; color: #ff1744; }

        /* Centrowany panel nakładkowy (BPM i START) */
        .floating-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            z-index: 10;
            border: 1px solid #333;
        }

        /* Pole wpisywania tempa */
        .bpm-input {
            font-size: 4.5rem;
            font-weight: bold;
            color: #00e676;
            background: transparent;
            border: none;
            border-bottom: 3px dashed #444;
            text-align: center;
            width: 160px;
            outline: none;
            margin: 0;
        }
        .bpm-input:focus {
            border-bottom: 3px solid #00e676;
        }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Główny przycisk START/STOP */
        .main-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            -webkit-user-select: none;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* PRAWA STRONA: Własna, dotykowa strefa suwaka (100% wysokości) */
        .right-slider-zone {
            position: absolute;
            right: 0;
            top: 0;
            width: 85px;
            height: 100vh;
            background: #151515;
            border-left: 2px solid #121212;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        /* Linia szyny suwaka */
        .track-line {
            position: absolute;
            left: 50%;
            top: 25px;
            bottom: 25px;
            width: 8px;
            background: #252525;
            transform: translateX(-50%);
            border-radius: 4px;
            pointer-events: none; /* Kliknięcia lecą do rodzica zone */
        }

        /* Własny suwak (Thumb) pozycjonowany przez JS */
        .custom-thumb {
            position: absolute;
            left: 50%;
            top: 50%; /* Sterowane z poziomu JS */
            width: 54px;
            height: 54px;
            background: #00e676;
            border-radius: 14px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            pointer-events: none; /* Palec jest wykrywany przez całą strefę bocznego paska */
        }
    </style>
</head>
<body>

<div class="app-layout">
    
    <div class="left-controls">
        <button class="huge-btn" id="plusBtn">+</button>
        <button class="huge-btn" id="minusBtn">−</button>
        
        <div class="floating-display">
            <input type="number" id="bpmInput" class="bpm-input" min="40" max="250" value="120">
            <button id="playBtn" class="main-btn">START</button>
        </div>
    </div>
    
    <div class="right-slider-zone" id="sliderZone">
        <div class="track-line"></div>
        <div class="custom-thumb" id="customThumb"></div>
    </div>

</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let nextTickTime = 0.0;
    let timerId = null;
    
    const bpmInput = document.getElementById('bpmInput');
    const playBtn = document.getElementById('playBtn');
    const plusBtn = document.getElementById('plusBtn');
    const minusBtn = document.getElementById('minusBtn');
    
    const sliderZone = document.getElementById('sliderZone');
    const customThumb = document.getElementById('customThumb');

    const MIN_BPM = 40;
    const MAX_BPM = 250;
    let currentBPM = 120;

    function getBPMFromURL() {
        const params = new URLSearchParams(window.location.search);
        const bpm = parseInt(params.get('bpm'));
        if (bpm && bpm >= MIN_BPM && bpm <= MAX_BPM) {
            return bpm;
        }
        return 120;
    }

    function updateURL(bpm) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?bpm=' + bpm;
        window.history.pushState({path: newUrl}, '', newUrl);
    }

    // Nowa funkcja przeliczająca BPM na fizyczną pozycję suwaka na ekranie
    function updateThumbPosition() {
        const zoneHeight = sliderZone.clientHeight;
        const padding = 25; // margines od góry i dołu paska
        const availableHeight = zoneHeight - (padding * 2);
        
        // Oblicz procent wartości (odwrócony, bo im wyżej palec, tym większy BPM)
        const percent = (currentBPM - MIN_BPM) / (MAX_BPM - MIN_BPM);
        const topPx = padding + (availableHeight * (1 - percent));
        
        customThumb.style.top = topPx + 'px';
    }

    // Funkcja pobierająca dotyk i wyliczająca z niego BPM
    function handleSliderTouch(clientY) {
        const rect = sliderZone.getBoundingClientRect();
        const zoneHeight = rect.height;
        const padding = 25;
        const availableHeight = zoneHeight - (padding * 2);
        
        // Wyciągamy pozycję palca relatywną do paska
        let relativeY = clientY - rect.top - padding;
        // Ograniczenie ruchu wewnątrz bezpiecznej strefy
        relativeY = Math.max(0, Math.min(availableHeight, relativeY));
        
        // Zamiana pozycji Y na procent (odwrócony)
        const percent = 1 - (relativeY / availableHeight);
        const calculatedBPM = Math.round(MIN_BPM + (percent * (MAX_BPM - MIN_BPM)));
        
        setTempo(calculatedBPM);
    }

    function setTempo(newBPM, updateControls = true) {
        currentBPM = Math.max(MIN_BPM, Math.min(MAX_BPM, newBPM));
        
        bpmInput.value = currentBPM;
        updateThumbPosition();
        updateURL(currentBPM);
    }

    // OBSŁUGA DOTYKU DLA NOWEGO SUWAKA (Płynne ciągnięcie i klikanie)
    let isDragging = false;

    sliderZone.addEventListener('mousedown', (e) => {
        isDragging = true;
        handleSliderTouch(e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
        if (isDragging) {
            handleSliderTouch(e.clientY);
        }
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // Eventy dla ekranów dotykowych w smartfonach (Touch Events)
    sliderZone.addEventListener('touchstart', (e) => {
        isDragging = true;
        handleSliderTouch(e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (isDragging) {
            handleSliderTouch(e.touches[0].clientY);
            e.preventDefault(); // Blokada scrollowania strony podczas przeciągania
        }
    }, { passive: false });

    window.addEventListener('touchend', () => {
        isDragging = false;
    });

    // Inicjalizacja startowa
    currentBPM = getBPMFromURL();
    setTempo(currentBPM);
    // Mały timeout, żeby przeglądarka zdążyła poprawnie zmierzyć wysokość ekranu przy starcie
    setTimeout(updateThumbPosition, 100); 

    // Obsługa okna wpisywania z klawiatury
    bpmInput.addEventListener('input', (e) => {
        let val = parseInt(e.target.value);
        if (val) {
            setTempo(val, false);
            updateThumbPosition();
        }
    });

    bpmInput.addEventListener('blur', (e) => {
        let val = parseInt(e.target.value);
        if (!val || val < MIN_BPM) val = MIN_BPM;
        if (val > MAX_BPM) val = MAX_BPM;
        setTempo(val);
    });

    // Obsługa przycisków kroków
    plusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) + 1);
    });

    minusBtn.addEventListener('click', () => {
        setTempo(parseInt(currentBPM) - 1);
    });

    // Aktualizacja pozycji suwaka przy zmianie rozmiaru okna (np. obrót ekranu)
    window.addEventListener('resize', updateThumbPosition);

    // Silnik Audio
    function playClick(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 1000; 
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); 

        osc.start(time);
        osc.stop(time + 0.05);
    }

    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            playClick(nextTickTime);
            nextTickTime += 60.0 / currentBPM;
        }
        timerId = setTimeout(scheduler, 25);
    }

    playBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (isPlaying) {
            clearTimeout(timerId);
            playBtn.textContent = 'START';
            playBtn.style.background = '#00e676';
            isPlaying = false;
        } else {
            nextTickTime = audioCtx.currentTime + 0.05;
            scheduler();
            playBtn.textContent = 'STOP';
            playBtn.style.background = '#ff1744';
            isPlaying = true;
        }
    });
</script>

</body>
</html>
